[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mii-guide"
version = "1.0.0"
description = "Verifiable education guides for next-generation materials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
mii-guide = "mii_guide.cli:main"

[tool.setuptools]
packages = ["mii_guide"]
