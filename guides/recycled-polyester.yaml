# and add `accessed:` dates only for sources a person has actually opened.

slug: recycled-polyester
title: "Recycled Polyester: What the Evidence Actually Supports"
material: "Recycled polyester (rPET) in apparel and footwear"
summary: >
  Recycled polyester lowers the energy and greenhouse-gas cost of making
  polyester fibre compared with virgin polyester, and that finding is well
  supported. It does not make a garment biodegradable, it does not stop
  microfibre shedding, and almost none of it comes from old clothing. The
  gap between what the fibre does and what the marketing implies is where
  most of the confusion sits.
updated: "2026-09-01"
reviewers: []

section_order:
  - What it is
  - Environmental performance
  - What it does not do
  - Trade-offs and open questions

