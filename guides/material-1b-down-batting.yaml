# can reach Crossref before treating any DOI below as confirmed.

slug: material-1b-down-batting
title: "Material 1b — Down Batting / Sheet: Testing Reference"
material: "Down batting and down sheet for duvets, sleeping bags, and insulated apparel"
summary: >
  Five tests describe whether a down batting will stay warm in use: how well it
  springs back after compression, whether it holds its dimensions through washing,
  whether it contains the fill weight it claims, how thick it is, and how much heat
  it actually resists. No international standard sets a universal pass mark for any
  of them. Where this guide prints a number, it says whether that number comes from
  a standard, from published research, or from industry practice — and where the
  evidence is not good enough, it prints no number at all.
updated: "2026-09-01"
reviewers: []

section_order:
  - Test 1.1 — Compressibility & Recovery
  - Test 1.2 — Dimensional Stability to Washing
  - Test 1.3 — Fill Density
  - Test 1.4 — Loft / Thickness
  - Test 1.5 — Thermal Resistance
  - How to read the thresholds

