# published document is generated from the claims below, so no sentence can
# reach the page without its sources attached.
#
# It applies the 2026-08-12 citation audit rather than reproducing the draft:
#   - AUDIT 1.4-09/1.4-10  attributions corrected; the AUTEX paper carries its DOI.
#   - AUDIT 1.4-03         ISO 9073-2 bulky-nonwoven pressure is 0.02 kPa, not 0.5 kPa.
#   - AUDIT 1.4-07         the GB/T bulkiness ladder is `status: withheld` - the claim
#                          is made, the figure is not printed, per the guide's own rule.
#   - AUDIT 1.1-03         the resilience ranges (80-95 / 25-60 / 70-80%) and the
#                          needle-punch gap are ABSENT. Their sources could not be
